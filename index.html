<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hasan card maker - Virtual Master Card Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 30px auto;
            background: #141414;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
        }
        h2 {
            text-align: center;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #d4af37;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            border: none;
            color: #0d0d0d;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        button:hover {
            background: linear-gradient(135deg, #e6be40, #c5a034);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            display: none;
        }
        th, td {
            padding: 12px;
            border: 1px solid #332d16;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: #1f1b0d;
            color: #d4af37;
            text-transform: uppercase;
        }
        tr:nth-child(even) {
            background: #19160f;
        }
        tr:hover {
            background: #241f12;
        }
        .copy-btn {
            background: #d4af37;
            color: #0d0d0d;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #fff;
        }
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #d4af37;
            color: #0d0d0d;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👑 hasan card maker 👑</h2>
    <div class="form-group">
        <label for="bin">Enter BIN (Generates 10 Cards):</label>
        <input type="text" id="bin" name="bin" placeholder="e.g., 541333">
    </div>
    <button onclick="generateCards()">Generate 10 Cards</button>

    <table id="resultTable">
        <thead>
            <tr>
                <th>SL</th>
                <th>Card Combo (Number|MM|YY|CVV)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cardTableBody">
            <!-- JavaScript দিয়ে ডাটা লোড হবে -->
        </tbody>
    </table>
</div>

<div id="toast">Copied to Clipboard!</div>

<script>
// Luhn Algorithm ফাংশন জাভাস্ক্রিপ্টে
function generateLuhnChecksum(partialNumber) {
    let sum = 0;
    let length = partialNumber.length;
    let parity = length % 2;

    for (let i = 0; i < length; i++) {
        let digit = parseInt(partialNumber[i]);
        if (i % 2 === parity) {
            digit *= 2;
            if (digit > 9) {
                digit -= 9;
            }
        }
        sum += digit;
    }

    let mod = sum % 10;
    return (mod === 0) ? 0 : (10 - mod);
}

function generateCards() {
    let binInput = document.getElementById('bin').value.replace(/\D/g, '');
    if (!binInput) {
        alert('Please enter a valid BIN!');
        return;
    }

    let tbody = document.getElementById('cardTableBody');
    tbody.innerHTML = '';

    for (let i = 0; i < 10; i++) {
        let remainingLength = 15 - binInput.length;
        let tempCard = binInput;

        for (let j = 0; j < remainingLength; j++) {
            tempCard += Math.floor(Math.random() * 10);
        }

        let checkDigit = generateLuhnChecksum(tempCard);
        let cardNumber = tempCard + checkDigit;

        // এক্সপায়ার ডেট (মাস এবং বছর)
        let month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
        let currentYear = new Date().getFullYear() % 100;
        let year = currentYear + Math.floor(Math.random() * 4) + 1;

        // CVV
        let cvv = String(Math.floor(Math.random() * 900) + 100);

        let fullCombo = `${cardNumber}|${month}|${year}|${cvv}`;
        let rowId = `card-${i}`;

        let row = `<tr>
            <td>${i + 1}</td>
            <td id="${rowId}" style="font-family: monospace; letter-spacing: 1px; color: #f3e5ab;">${fullCombo}</td>
            <td><button class="copy-btn" onclick="copyToClipboard('${rowId}')">Copy</button></td>
        </tr>`;

        tbody.innerHTML += row;
    }

    document.getElementById('resultTable').style.display = 'table';
}

function copyToClipboard(containerId) {
    let textElement = document.getElementById(containerId).innerText;
    navigator.clipboard.writeText(textElement).then(function() {
        showToast();
    }, function(err) {
        alert('Failed to copy');
    });
}

function showToast() {
    let toast = document.getElementById("toast");
    toast.className = "show";
    setTimeout(function(){ 
        toast.className = toast.className.replace("show", ""); 
    }, 3000);
}
</script>

</body>
</html>
